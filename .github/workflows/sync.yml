name: sync upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork
        run: gh api repos/lijianbin2/edgetunnel/merge-upstream --method POST -f branch=main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
